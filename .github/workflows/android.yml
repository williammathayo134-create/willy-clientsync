name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libsqlite3-dev sqlite3 bzip2 libbz2-dev libssl-dev openssl libffi-dev zlib1g-dev libreadline-dev libncurses5-dev libncursesw5-dev libgdbm-dev liblzma-dev tk-dev git zip unzip ccache lld autoconf libtool pkg-config

    - name: Install Buildozer & Cython
      run: |
        pip install --upgrade pip setuptools
        pip install "cython<3.0.0"
        pip install buildozer

    - name: Build APK
      run: |
        yes | buildozer -v android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: WillyClientSync-APK
        path: bin/*.apk
